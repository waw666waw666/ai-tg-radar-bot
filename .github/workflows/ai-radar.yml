name: AI Feishu Radar Bot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-radar.yml"
      - "main.py"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-feishu-radar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "repository=${{ github.repository }}"
          echo "workflow=${{ github.workflow }}"
          echo "sha=${{ github.sha }}"
          date -u

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workflow file
        run: |
          echo "===== .github/workflows/ai-radar.yml ====="
          sed -n '1,180p' .github/workflows/ai-radar.yml
          echo "===== end ====="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_BASE_URL: ${{ secrets.MODELSCOPE_BASE_URL }}
          MODELSCOPE_MODEL: ${{ secrets.MODELSCOPE_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          print("DEEPSEEK_API_KEY set:", bool(os.environ.get("DEEPSEEK_API_KEY")))
          print("MODELSCOPE_API_KEY set:", bool(os.environ.get("MODELSCOPE_API_KEY")))
          print("MODELSCOPE_BASE_URL set:", bool(os.environ.get("MODELSCOPE_BASE_URL")))
          print("MODELSCOPE_MODEL set:", bool(os.environ.get("MODELSCOPE_MODEL")))
          print("FEISHU_WEBHOOK set:", bool(os.environ.get("FEISHU_WEBHOOK")))
          PY

      - name: Run bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_BASE_URL: ${{ secrets.MODELSCOPE_BASE_URL }}
          MODELSCOPE_MODEL: ${{ secrets.MODELSCOPE_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py

      - name: Commit seen cache
        if: github.event_name != 'push'
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add seen.json || true
          git commit -m "Update seen cache" || echo "No changes to commit"
          git push || true
