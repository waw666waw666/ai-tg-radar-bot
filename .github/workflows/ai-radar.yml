name: AI Feishu Radar Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: ai-feishu-radar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          print("DEEPSEEK_API_KEY set:", bool(os.environ.get("DEEPSEEK_API_KEY")))
          print("FEISHU_WEBHOOK set:", bool(os.environ.get("FEISHU_WEBHOOK")))
          print("FEISHU_WEBHOOK length:", len(os.environ.get("FEISHU_WEBHOOK", "")))
          PY

      - name: Run bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py

      - name: Commit seen cache
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add seen.json || true
          git commit -m "Update seen cache" || echo "No changes to commit"
          git push || true
